name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        goos:
          - linux
          - darwin
          - windows
        goarch:
          - amd64
          - arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and package executable
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          binary="youtube2dvd"
          if [[ "$GOOS" == "windows" ]]; then
            binary="youtube2dvd.exe"
          fi

          mkdir -p package dist
          archive="youtube2dvd_${GOOS}_${GOARCH}"
          version="$(git describe --tags --always --dirty)"
          ldflags="-s -w -X main.version=${version}"

          if [[ "$GOOS" == "darwin" ]]; then
            app="package/youtube2dvd.app"
            mkdir -p "${app}/Contents/MacOS"
            cp packaging/darwin/Info.plist "${app}/Contents/Info.plist"
            bundle_version="${version#v}"
            bundle_version="${bundle_version%%-*}"
            if [[ ! "$bundle_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              bundle_version="0.0.0"
            fi
            sed -i "s/@VERSION@/${bundle_version}/g" "${app}/Contents/Info.plist"
            go build -trimpath -ldflags="${ldflags}" -o "${app}/Contents/MacOS/${binary}" .
            (cd package && zip -r "../dist/${archive}.zip" "youtube2dvd.app")
          elif [[ "$GOOS" == "windows" ]]; then
            go build -trimpath -ldflags="${ldflags}" -o "package/${binary}" .
            (cd package && zip "../dist/${archive}.zip" "${binary}")
          else
            go build -trimpath -ldflags="${ldflags}" -o "package/${binary}" .
            tar -C package -czf "dist/${archive}.tar.gz" "${binary}"
          fi

      - name: Upload packaged executable
        uses: actions/upload-artifact@v4
        with:
          name: youtube2dvd-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download executables
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum youtube2dvd_* > checksums.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
